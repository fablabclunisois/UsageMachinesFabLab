<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<title>Utilisation des machines</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f3ee; --card:#fff; --ink:#1d1b19; --muted:#6d675f; --line:#e2dcd2;
  --accent:#c2410c; --accent-ink:#fff; --soft:#fbeee6;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#1d4ed8;
  --t-fdm:#ea580c; --t-sla:#7c3aed; --t-sls:#0d9488; --t-laser:#dc2626; --t-usinage:#475569;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#171513; --card:#211f1c; --ink:#f3efe8; --muted:#a39b90; --line:#37332d;
    --accent:#fb923c; --accent-ink:#1a0e05; --soft:#2d2018;
    --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#93c5fd; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);
  padding:calc(10px + env(safe-area-inset-top)) 16px 0}
@media (prefers-color-scheme:dark){header{background:#2b1c12;color:#fb923c;border-bottom:1px solid var(--line)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:.01em}
h1 small{display:block;font-weight:500;opacity:.8;font-size:.78rem}
.sync{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:5px 11px;font:inherit;font-size:.8rem;min-height:32px}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;border:0;background:transparent;color:inherit;opacity:.75;font:inherit;font-weight:600;padding:11px 4px;border-bottom:3px solid transparent;min-height:44px}
.tab[aria-selected=true]{opacity:1;border-bottom-color:currentColor}
.tab .n{display:inline-block;min-width:1.5em;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.28);margin-left:6px;font-size:.78rem}
main{max-width:640px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-size:1.1rem;margin:0 0 12px}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 8px}
label,.lab{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
.hint{font-weight:400;color:var(--muted);font-size:.82rem}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
.inline{display:flex;gap:8px}
.inline>input{flex:1;min-width:0}
input[type=datetime-local]{min-width:0;max-width:100%}
.inline .btn{flex:none}
.dur{display:flex;gap:10px;align-items:center}
.dur input{width:5.5em;text-align:center}
.dur span{color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{border:1.5px solid var(--line);background:var(--card);color:inherit;border-radius:10px;padding:10px 14px;min-height:46px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn.ok{color:var(--ok);border-color:var(--ok)} .btn.bad{color:var(--bad);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:inherit;border-radius:999px;padding:8px 14px;min-height:40px}
.chip[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.sug{border-style:dashed;font-size:.88rem;color:var(--muted)}
.chip .x{margin-left:6px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mbtn{border:1.5px solid var(--line);border-left-width:6px;background:var(--bg);color:inherit;border-radius:10px;padding:12px;text-align:left;min-height:54px;font-weight:600}
.mbtn .st{display:block;font-weight:600;font-size:.8rem;margin-top:3px}
.st-free{color:var(--ok)} .st-busy{color:var(--warn)} .st-over{color:var(--bad)} .st-unk{color:var(--muted)}
.upd{font-weight:400;color:var(--muted);font-size:.8rem}
.mbtn[data-t=fdm]{border-left-color:var(--t-fdm)} .mbtn[data-t=sla]{border-left-color:var(--t-sla)} .mbtn[data-t=sls]{border-left-color:var(--t-sls)}
.mbtn[data-t=laser]{border-left-color:var(--t-laser)} .mbtn[data-t=usinage]{border-left-color:var(--t-usinage)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);color:inherit;padding:10px;min-height:44px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.mline{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.errors{background:color-mix(in srgb,var(--bad) 12%,var(--card));border:1.5px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 14px;margin:14px 0 0;font-weight:600;font-size:.92rem}
.errors ul{margin:0;padding-left:18px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.savebar .btn{flex:1;max-width:320px}
.entry{border-left:6px solid var(--t-usinage);position:relative}
.entry[data-t=fdm]{border-left-color:var(--t-fdm)} .entry[data-t=sla]{border-left-color:var(--t-sla)} .entry[data-t=sls]{border-left-color:var(--t-sls)}
.entry[data-t=laser]{border-left-color:var(--t-laser)}
.entry .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.entry .name{font-weight:700;font-size:1.05rem}
.entry .who{color:var(--muted);font-size:.92rem}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;border:1.5px solid currentColor;white-space:nowrap}
.s-Lancé{color:var(--info)} .s-Terminé{color:var(--ok)} .s-Échec{color:var(--bad)} .s-Annulé{color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 12px;font-size:.92rem}
dt{color:var(--muted)} dd{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.pending{color:var(--warn);font-size:.8rem;font-weight:600;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1.5px solid var(--warn);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:20;font-weight:600;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{max-width:640px;margin:6px auto 0;padding:0 14px 20px;text-align:center;font-size:.8rem;color:var(--muted)}
footer a{color:inherit}
/* page QR */
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.qrcard{text-align:center;break-inside:avoid;background:#fff;color:#000;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.qrcard svg{width:100%;height:auto;display:block}
.qrcard b{display:block;font-size:1.05rem;margin-top:4px}
.qrcard small{color:#555}
@media print{
  header,.savebar,.noprint,footer,.toast{display:none!important}
  body{background:#fff;padding:0} main{max-width:none;padding:0}
  .qrgrid{grid-template-columns:repeat(2,1fr)} .qrcard{border:1px solid #999}
}
</style>
</head>
<body>
<header id="hdr">
  <div class="top">
    <h1 id="ttl">FabLab<small>Utilisation des machines</small></h1>
    <button class="sync" id="sync" type="button" aria-live="polite">…</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-new" data-tab="new" aria-selected="true">Saisir</button>
    <button class="tab" role="tab" id="tab-list" data-tab="list" aria-selected="false">Mes saisies <span class="n" id="cnt" hidden>0</span></button>
  </div>
</header>
<main id="view"></main>
<footer id="foot">v1</footer>
<div class="savebar" id="bar" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="qr.js"></script>
<script>
(function(){
'use strict';
const CFG = window.FABLAB_CONFIG || {machines:[]};
const LS = {entries:'fabmach.entries', key:'fabmach.key', user:'fabmach.lastUser', stock:'fabmach.stockMat'};
const TYPES = {
  fdm:{label:'Imprimantes 3D FDM', short:'FDM'}, sla:{label:'Imprimantes 3D SLA', short:'SLA'}, sls:{label:'Imprimantes 3D SLS', short:'SLS'},
  laser:{label:'Découpe laser', short:'Laser'}, usinage:{label:'Machines d’usinage', short:'Usinage'}
};
const STATUSES = ['Lancé','Terminé','Échec','Annulé'];
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view = $('#view'), bar = $('#bar');

/* ---------- stockage local ---------- */
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let entries = lsGet(LS.entries, []);
function saveEntries(){ lsSet(LS.entries, entries); }
function getKey(){ return lsGet(LS.key, ''); }
const machineById = id => (CFG.machines||[]).find(m => m.id === id);
const newId = () => (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,12);

// Clé d'accès et machine pré-choisie fournies par le QR code
const params = new URLSearchParams(location.search);
if (params.has('k')){
  lsSet(LS.key, params.get('k'));
  params.delete('k');
  const q = params.toString();
  try{ history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash); }catch(e){}
}
const preMachine = params.get('m');
const qrMode = params.has('qr');

// Nettoyage des vieilles saisies déjà synchronisées (garde 120 jours)
(function prune(){
  const lim = Date.now() - 120*864e5, n = entries.length;
  entries = entries.filter(e => e._dirty || new Date(e.updated||e.launch).getTime() > lim);
  if (entries.length !== n) saveEntries();
})();

/* ---------- utilitaires ---------- */
const pad = n => String(n).padStart(2,'0');
function toLocalInput(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}) + ' à ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtDur(min){ min = Math.round(min); if (min < 60) return min + ' min'; const h = Math.floor(min/60), m = min%60; return h + ' h' + (m ? ' ' + pad(m) : ''); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function uniqCI(list){ const seen = new Set(), out = []; list.forEach(v => { const k = String(v).trim().toLowerCase(); if (k && !seen.has(k)){ seen.add(k); out.push(String(v).trim()); } }); return out; }

/* ---------- matériaux proposés (réglages + stock facultatif) ---------- */
function materialSuggestions(type){
  const base = (CFG.materials && CFG.materials[type]) || [];
  const stock = lsGet(LS.stock, {});
  const extra = type==='fdm' ? stock.filament : type==='sla' ? stock.resine : [];
  return uniqCI(base.concat(extra || []));
}
async function loadStockMaterials(){
  if (!CFG.stockUrl) return;
  try{
    const r = await fetch(CFG.stockUrl, {cache:'no-cache'});
    const j = await r.json(), out = {filament:[], resine:[]};
    (j.items||[]).forEach(it => { if (out[it.category] && it.material) out[it.category].push(it.material); });
    out.filament = uniqCI(out.filament); out.resine = uniqCI(out.resine);
    lsSet(LS.stock, out);
  }catch(e){ /* hors ligne : on garde la dernière liste connue */ }
}

/* ---------- synchronisation vers Google Sheets ---------- */
let syncing = false, syncState = '', keyError = false;
function toServer(e){
  return {id:e.id, created:e.created, launch:e.launch, machine:e.machine, type:e.type, user:e.user, status:e.status,
    duration:e.duration, durationKind:e.durationKind, nozzles:e.nozzles, materials:e.materials, volume:e.volume,
    laser:e.laser, lens:e.lens, note:e.note};
}
function setBadge(){
  const b = $('#sync'), dirty = entries.filter(e => e._dirty).length;
  let txt;
  if (!CFG.scriptUrl) txt = '⚠ non configuré';
  else if (keyError) txt = '⚠ code d’accès';
  else if (syncing) txt = '⟳ envoi…';
  else if (dirty) txt = '⟳ ' + dirty + ' à envoyer';
  else txt = '✓ envoyé';
  b.textContent = txt;
  const c = $('#cnt'); c.hidden = !entries.length; c.textContent = entries.length;
}
async function sync(manual){
  if (!CFG.scriptUrl){ if (manual) toast('scriptUrl est vide dans config.js'); setBadge(); return; }
  if (syncing) return;
  const todo = entries.filter(e => e._dirty);
  if (!todo.length){ setBadge(); if (manual) toast('Tout est déjà envoyé'); return; }
  syncing = true; setBadge();
  try{
    for (let i = 0; i < todo.length; i += 20){
      const chunk = todo.slice(i, i+20), revs = {};
      chunk.forEach(e => revs[e.id] = e._rev);
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 25000);
      let res;
      try{
        res = await fetch(CFG.scriptUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({k:getKey(), records:chunk.map(toServer)}), signal: ctl.signal});
      } finally { clearTimeout(to); }
      const j = await res.json();
      if (!j.ok){
        if (j.error === 'cle'){ keyError = true; if (manual) toast('Code d’accès invalide : rescanne le QR code du FabLab'); }
        else if (manual) toast('Le serveur a refusé l’envoi (' + j.error + ')');
        break;
      }
      keyError = false;
      (j.saved||[]).forEach(id => { const e = entries.find(x => x.id === id); if (e && e._rev === revs[id]){ e._dirty = false; e._syncedAt = new Date().toISOString(); } });
      saveEntries();
    }
    if (manual && !keyError && !entries.some(e => e._dirty)) toast('Envoyé ✓');
  }catch(err){
    if (manual) toast('Pas de connexion : l’envoi sera retenté automatiquement');
  }finally{
    syncing = false; setBadge(); if (tab === 'list') renderList();
  }
}
$('#sync').addEventListener('click', () => sync(true));
window.addEventListener('online', () => sync());
document.addEventListener('visibilitychange', () => { if (!document.hidden){ sync(); loadStatus(); } });
setInterval(() => { if (entries.some(e => e._dirty)) sync(); }, 45000);
setInterval(() => { if (!document.hidden && tab === 'new' && draft && draft.picking) loadStatus(); }, 60000);

/* ---------- état des machines à l'instant t ---------- */
let busy = [], busyAt = 0;
const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
async function loadStatus(){
  if (!CFG.scriptUrl || qrMode) return;
  try{
    const r = await fetch(CFG.scriptUrl + '?action=status&k=' + encodeURIComponent(getKey()), {cache:'no-store'});
    const j = await r.json();
    if (j.ok){ busy = j.busy || []; busyAt = Date.now(); if (tab === 'new' && draft && (draft.picking || !draft.machineId)) renderForm(); }
  }catch(e){ /* hors ligne : on garde le dernier état connu */ }
}
function machineState(m){
  if (!busyAt && !entries.some(e => e._dirty)) return null;
  const list = busy.filter(b => b.machine === m.name)
    .concat(entries.filter(e => e._dirty && e.status === 'Lancé' && e.machineId === m.id).map(e => ({launch:e.launch, duration:e.duration})));
  if (!list.length) return busyAt ? {k:'free', txt:'Libre'} : null;
  const last = list.reduce((a, b) => new Date(b.launch) > new Date(a.launch) ? b : a);
  const end = new Date(new Date(last.launch).getTime() + last.duration * 60000);
  const day = end.toDateString() === new Date().toDateString() ? '' : end.toLocaleDateString('fr-FR', {weekday:'short'}) + ' ';
  return end > new Date() ? {k:'busy', txt:'En cours · fin prévue ' + day + hhmm(end)} : {k:'over', txt:'Fin prévue dépassée (' + day + hhmm(end) + ') · à confirmer'};
}
const stateHtml = m => { const s = machineState(m); return s ? '<span class="st st-' + s.k + '">' + esc(s.txt) + '</span>' : ''; };

/* ---------- formulaire ---------- */
let tab = 'new', draft = null;

function blankDraft(machineId){
  const now = new Date(); now.setSeconds(0,0);
  const d = {id:null, created:null, machineId:machineId||'', user:lsGet(LS.user,''), launch:toLocalInput(now), status:'Lancé',
    h:'', min:'', durationKind:'planned', nozzles:[], materials:[], material:'', volume:'', laser:'', lens:'', note:'', picking:!machineId, errors:[]};
  applyMachineDefaults(d);
  return d;
}
function draftFromEntry(e, asCopy){
  const now = new Date(); now.setSeconds(0,0);
  const d = {id: asCopy ? null : e.id, created: asCopy ? null : e.created, machineId:e.machineId, user:e.user,
    launch: asCopy ? toLocalInput(now) : toLocalInput(new Date(e.launch)), status: asCopy ? 'Lancé' : e.status,
    h: Math.floor(e.duration/60) || '', min: (e.duration%60) || '', durationKind:e.durationKind,
    nozzles:(e.nozzles||[]).slice(), materials:(e.materials||[]).slice(), material:(e.materials||[])[0]||'',
    volume: e.volume==null ? '' : e.volume, laser:e.laser||'', lens:e.lens||'', note:e.note||'', picking:false, errors:[], copy:!!asCopy};
  return d;
}
function applyMachineDefaults(d){
  const m = machineById(d.machineId); if (!m) return;
  if (m.type === 'fdm'){ if (m.nozzles && m.nozzles.length === 1 && !d.nozzles.length) d.nozzles = [m.nozzles[0]]; }
  if (m.type === 'laser'){
    const ls = m.lasers || CFG.lasers || [], ln = m.lenses || CFG.lenses || [];
    if (ls.length === 1 && !d.laser) d.laser = ls[0];
    if (ln.length === 1 && !d.lens) d.lens = ln[0];
  }
  if (m.type === 'usinage') d.durationKind = 'effective';
  else if (m.type !== 'laser') d.durationKind = 'planned';
}

function chipBtn(act, val, pressed, extra){
  return '<button type="button" class="chip' + (extra||'') + '" data-act="' + act + '" data-v="' + esc(val) + '" aria-pressed="' + pressed + '">' + esc(val) + '</button>';
}
function durationBlock(m){
  let label, toggle = '';
  if (m.type === 'laser'){
    label = 'Durée';
    toggle = '<div class="seg" style="margin-bottom:8px">' +
      '<button type="button" data-act="dkind" data-v="planned" aria-pressed="' + (draft.durationKind==='planned') + '">Prévue</button>' +
      '<button type="button" data-act="dkind" data-v="effective" aria-pressed="' + (draft.durationKind==='effective') + '">Effective</button></div>';
  } else if (m.type === 'usinage') label = 'Durée effective';
  else label = 'Durée prévue <span class="hint">(indiquée par le slicer)</span>';
  return '<div class="lab">' + label + '</div>' + toggle +
    '<div class="dur"><input data-f="h" type="number" inputmode="numeric" min="0" max="999" placeholder="0" value="' + esc(draft.h) + '" aria-label="Heures"><span>h</span>' +
    '<input data-f="min" type="number" inputmode="numeric" min="0" max="59" placeholder="0" value="' + esc(draft.min) + '" aria-label="Minutes"><span>min</span></div>';
}
function singleMaterialBlock(m, label, hint){
  const sugg = materialSuggestions(m.type).slice(0, 10);
  return '<label for="f-mat">' + label + (hint ? ' <span class="hint">' + hint + '</span>' : '') + '</label>' +
    '<input id="f-mat" data-f="material" list="dl-mat" autocomplete="off" value="' + esc(draft.material) + '" placeholder="Choisir ou taper">' +
    '<datalist id="dl-mat">' + materialSuggestions(m.type).map(s => '<option value="' + esc(s) + '">').join('') + '</datalist>' +
    '<div class="chips" style="margin-top:8px">' + sugg.map(s => '<button type="button" class="chip sug" data-act="sugmat" data-v="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>';
}
function multiMaterialBlock(m){
  const sel = draft.materials, sugg = materialSuggestions(m.type).filter(s => !sel.some(x => x.toLowerCase() === s.toLowerCase())).slice(0, 10);
  return '<div class="lab">Matériau(x) imprimé(s) <span class="hint">(plusieurs possibles)</span></div>' +
    '<div class="chips" style="margin-bottom:8px">' + sel.map(s => '<button type="button" class="chip" aria-pressed="true" data-act="rmmat" data-v="' + esc(s) + '">' + esc(s) + '<span class="x">✕</span></button>').join('') + '</div>' +
    '<div class="inline"><input id="f-newmat" list="dl-mat" autocomplete="off" placeholder="Ajouter un matériau" aria-label="Ajouter un matériau">' +
    '<button type="button" class="btn" data-act="addmat">Ajouter</button></div>' +
    '<datalist id="dl-mat">' + materialSuggestions(m.type).map(s => '<option value="' + esc(s) + '">').join('') + '</datalist>' +
    '<div class="chips" style="margin-top:8px">' + sugg.map(s => '<button type="button" class="chip sug" data-act="sugaddmat" data-v="' + esc(s) + '">+ ' + esc(s) + '</button>').join('') + '</div>';
}

function renderForm(){
  const m = machineById(draft.machineId);
  const editing = !!draft.id;
  let h = '';
  if (!CFG.scriptUrl) h += '<div class="banner">⚠ <b>scriptUrl</b> est vide dans <code>config.js</code> : les saisies restent sur ce téléphone et ne sont pas envoyées.</div>';
  if (keyError) h += '<div class="banner">⚠ Code d’accès manquant ou invalide : rescanne le QR code affiché au FabLab pour pouvoir envoyer tes saisies.</div>';
  h += '<section class="card"><h2>' + (editing ? 'Modifier la saisie' : draft.copy ? 'Nouvelle saisie (copie)' : 'Nouvelle saisie') + '</h2>';

  // machine
  h += '<div class="lab" style="margin-top:0">Machine' + ((!m || draft.picking) && busyAt ? ' <span class="upd">· état à ' + hhmm(new Date(busyAt)) + '</span>' : '') + '</div>';
  if (!m || draft.picking){
    Object.keys(TYPES).forEach(t => {
      const ms = (CFG.machines||[]).filter(x => x.type === t); if (!ms.length) return;
      h += '<h3>' + TYPES[t].label + '</h3><div class="grid">' + ms.map(x => '<button type="button" class="mbtn" data-t="' + t + '" data-act="machine" data-v="' + esc(x.id) + '">' + esc(x.name) + stateHtml(x) + '</button>').join('') + '</div>';
    });
  } else {
    h += '<div class="mline"><span><b>' + esc(m.name) + '</b> <span class="hint">· ' + TYPES[m.type].short + '</span></span><button type="button" class="btn small" data-act="pick">Changer</button></div>';
  }

  if (m && !draft.picking){
    h += '<label for="f-user">Étudiant, projet ou «&nbsp;/&nbsp;»</label>' +
      '<div class="inline"><input id="f-user" data-f="user" autocomplete="off" maxlength="120" value="' + esc(draft.user) + '" placeholder="Nom, projet…">' +
      '<button type="button" class="btn" data-act="slash" aria-label="Aucun nom ni projet">/</button></div>';
    h += '<label for="f-launch">Heure de lancement</label>' +
      '<div class="inline"><input id="f-launch" data-f="launch" type="datetime-local" value="' + esc(draft.launch) + '"><button type="button" class="btn" data-act="now">Maintenant</button></div>';

    if (m.type === 'fdm'){
      const list = uniqCI((m.nozzles || ['0.4 mm']).concat(draft.nozzles));
      h += '<div class="lab">Buse(s) utilisée(s) <span class="hint">(plusieurs possibles)</span></div><div class="chips">' +
        list.map(n => chipBtn('nozzle', n, draft.nozzles.includes(n))).join('') + '</div>';
      h += durationBlock(m) + multiMaterialBlock(m);
    }
    if (m.type === 'sla'){
      h += durationBlock(m) + singleMaterialBlock(m, 'Matériau (résine)') +
        '<label for="f-vol">Volume de résine <span class="hint">(mL, donné par le slicer)</span></label><input id="f-vol" data-f="volume" type="number" inputmode="decimal" min="0" step="any" value="' + esc(draft.volume) + '">';
    }
    if (m.type === 'sls'){
      h += durationBlock(m) +
        '<label for="f-vol">Volume de matériau <span class="hint">(mL = cm³)</span></label><input id="f-vol" data-f="volume" type="number" inputmode="decimal" min="0" step="any" value="' + esc(draft.volume) + '">' +
        singleMaterialBlock(m, 'Matériau', '(facultatif)');
    }
    if (m.type === 'laser'){
      const ls = m.lasers || CFG.lasers || [], ln = m.lenses || CFG.lenses || [];
      h += '<div class="lab">Laser utilisé</div><div class="chips">' + ls.map(v => chipBtn('laser', v, draft.laser === v)).join('') + '</div>' +
        '<div class="lab">Lentille utilisée</div><div class="chips">' + ln.map(v => chipBtn('lens', v, draft.lens === v)).join('') + '</div>' +
        durationBlock(m);
    }
    if (m.type === 'usinage'){
      h += durationBlock(m) + singleMaterialBlock(m, 'Matériau usiné');
    }

    if (editing){
      h += '<label for="f-status">Statut</label><select id="f-status" data-f="status">' + STATUSES.map(s => '<option' + (s === draft.status ? ' selected' : '') + '>' + s + '</option>').join('') + '</select>';
    }
    h += '<label for="f-note">Remarque <span class="hint">(facultatif — ex. cause d’un échec)</span></label><textarea id="f-note" data-f="note" maxlength="500">' + esc(draft.note) + '</textarea>';
    h += '<div id="errs"></div>';
  }
  h += '</section>';
  view.innerHTML = h;

  bar.hidden = !(m && !draft.picking);
  bar.innerHTML = '<button type="button" class="btn primary" data-act="save">Enregistrer</button>' +
    (editing || draft.copy ? '<button type="button" class="btn" data-act="cancel" style="flex:.6">Annuler</button>' : '');
}

function validate(m){
  const e = [], toNum = v => Number(String(v).replace(',', '.'));
  if (!draft.user.trim()) e.push('Indique ton nom, ton projet ou « / ».');
  if (!draft.launch || isNaN(new Date(draft.launch).getTime())) e.push('Indique l’heure de lancement.');
  const dur = (Number(draft.h)||0)*60 + (Number(draft.min)||0);
  if (!(dur > 0)) e.push('Indique la durée.');
  if (m.type === 'fdm'){
    if (!draft.nozzles.length) e.push('Indique la ou les buses utilisées.');
    if (!draft.materials.length) e.push('Indique le ou les matériaux imprimés.');
  }
  if (m.type === 'sla'){
    if (!draft.material.trim()) e.push('Indique le matériau (résine).');
    if (!(toNum(draft.volume) > 0)) e.push('Indique le volume de résine (mL).');
  }
  if (m.type === 'sls' && !(toNum(draft.volume) > 0)) e.push('Indique le volume de matériau (mL).');
  if (m.type === 'laser'){
    if (!draft.laser) e.push('Indique le laser utilisé.');
    if (!draft.lens) e.push('Indique la lentille utilisée.');
  }
  if (m.type === 'usinage' && !draft.material.trim()) e.push('Indique le matériau usiné.');
  return e;
}

function save(){
  const m = machineById(draft.machineId); if (!m) return;
  const errs = validate(m);
  if (errs.length){
    $('#errs').innerHTML = '<div class="errors" role="alert"><ul>' + errs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
    $('#errs').scrollIntoView({block:'center', behavior:'smooth'});
    return;
  }
  const now = new Date().toISOString(), old = draft.id ? entries.find(x => x.id === draft.id) : null;
  const t = m.type;
  const e = {
    id: draft.id || newId(), created: old ? old.created : now, updated: now,
    launch: new Date(draft.launch).toISOString(), machineId: m.id, machine: m.name, type: t,
    user: draft.user.trim(), status: draft.status || 'Lancé',
    duration: (Number(draft.h)||0)*60 + (Number(draft.min)||0),
    durationKind: (t === 'laser' || t === 'usinage') ? draft.durationKind : 'planned',
    nozzles: t === 'fdm' ? draft.nozzles.slice() : [],
    materials: t === 'fdm' ? draft.materials.slice() : (t === 'sla' || t === 'sls' || t === 'usinage') && draft.material.trim() ? [draft.material.trim()] : [],
    volume: (t === 'sla' || t === 'sls') ? Number(String(draft.volume).replace(',', '.')) : '',
    laser: t === 'laser' ? draft.laser : '', lens: t === 'laser' ? draft.lens : '',
    note: draft.note.trim(), _dirty: true, _rev: ((old && old._rev) || 0) + 1
  };
  if (old) Object.assign(old, e); else entries.push(e);
  lsSet(LS.user, e.user);
  saveEntries(); draft = null; setBadge();
  toast('Enregistré ✓'); show('list'); sync();
}

/* ---------- liste « Mes saisies » ---------- */
function renderList(){
  bar.hidden = true;
  let h = '';
  if (!CFG.scriptUrl) h += '<div class="banner">⚠ <b>scriptUrl</b> est vide dans <code>config.js</code> : rien n’est envoyé au tableur.</div>';
  if (keyError) h += '<div class="banner">⚠ Code d’accès manquant ou invalide : rescanne le QR code du FabLab pour envoyer tes saisies.</div>';
  const list = entries.slice().sort((a,b) => new Date(b.launch) - new Date(a.launch));
  if (!list.length){
    h += '<div class="empty">Aucune saisie sur ce téléphone.<br>Tes lancements enregistrés apparaîtront ici et tu pourras les modifier (échec, changement de machine…).</div>';
  }
  list.forEach(e => {
    const rows = [];
    rows.push(['Lancement', fmtDate(e.launch)]);
    rows.push([e.type === 'usinage' ? 'Durée effective' : e.durationKind === 'effective' ? 'Durée effective' : 'Durée prévue', fmtDur(e.duration)]);
    if (e.nozzles && e.nozzles.length) rows.push(['Buse(s)', e.nozzles.join(', ')]);
    if (e.materials && e.materials.length) rows.push(['Matériau(x)', e.materials.join(', ')]);
    if (e.volume !== '' && e.volume != null) rows.push(['Volume', String(e.volume).replace('.', ',') + ' mL']);
    if (e.type === 'laser') rows.push(['Laser', e.laser + ' · lentille ' + e.lens]);
    if (e.note) rows.push(['Remarque', e.note]);
    h += '<article class="card entry" data-t="' + e.type + '"><div class="head"><div><div class="name">' + esc(e.machine) + '</div><div class="who">' + esc(e.user) + '</div></div>' +
      '<span class="badge s-' + esc(e.status) + '">' + esc(e.status) + '</span></div>' +
      '<dl>' + rows.map(r => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl>' +
      '<div class="actions">' +
      (e.status === 'Lancé' ? '<button class="btn small ok" data-act="setstatus" data-id="' + esc(e.id) + '" data-v="Terminé">✓ Terminé</button><button class="btn small bad" data-act="setstatus" data-id="' + esc(e.id) + '" data-v="Échec">✗ Échec</button>' : '') +
      '<button class="btn small" data-act="edit" data-id="' + esc(e.id) + '">Modifier</button>' +
      '<button class="btn small" data-act="copy" data-id="' + esc(e.id) + '">Relancer</button></div>' +
      (e._dirty ? '<div class="pending">⟳ En attente d’envoi</div>' : '') + '</article>';
  });
  view.innerHTML = h;
}

/* ---------- événements ---------- */
view.addEventListener('input', ev => {
  const f = ev.target.dataset && ev.target.dataset.f;
  if (f && draft) draft[f] = ev.target.value;
});
function onClick(ev){
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const v = b.dataset.v, a = b.dataset.act;
  if (a === 'machine'){ draft.machineId = v; draft.picking = false; applyMachineDefaults(draft); renderForm(); window.scrollTo({top:0}); }
  else if (a === 'pick'){ draft.picking = true; renderForm(); }
  else if (a === 'slash'){ draft.user = '/'; $('#f-user').value = '/'; }
  else if (a === 'now'){ const n = new Date(); n.setSeconds(0,0); draft.launch = toLocalInput(n); $('#f-launch').value = draft.launch; }
  else if (a === 'dkind'){ draft.durationKind = v; document.querySelectorAll('[data-act=dkind]').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === v)); }
  else if (a === 'nozzle'){ toggleIn(draft.nozzles, v); b.setAttribute('aria-pressed', draft.nozzles.includes(v)); }
  else if (a === 'laser' || a === 'lens'){ draft[a] = v; document.querySelectorAll('[data-act=' + a + ']').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === v)); }
  else if (a === 'sugmat'){ draft.material = v; $('#f-mat').value = v; }
  else if (a === 'sugaddmat'){ addMat(v, false); }
  else if (a === 'addmat'){ const i = $('#f-newmat'); addMat(i.value, true); }
  else if (a === 'rmmat'){ draft.materials = draft.materials.filter(x => x !== v); renderForm(); }
  else if (a === 'save') save();
  else if (a === 'cancel'){ draft = null; show('list'); }
  else if (a === 'edit' || a === 'copy'){
    const e = entries.find(x => x.id === b.dataset.id); if (!e) return;
    draft = draftFromEntry(e, a === 'copy'); show('new');
  }
  else if (a === 'setstatus'){
    const e = entries.find(x => x.id === b.dataset.id); if (!e) return;
    e.status = v; e.updated = new Date().toISOString(); e._dirty = true; e._rev = (e._rev||0) + 1;
    saveEntries(); setBadge(); renderList(); sync();
  }
}
function toggleIn(arr, v){ const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
function addMat(val, refocus){
  val = String(val||'').trim(); if (!val) return;
  if (!draft.materials.some(x => x.toLowerCase() === val.toLowerCase())) draft.materials.push(val);
  renderForm(); if (refocus){ const i = $('#f-newmat'); if (i) i.focus(); }
}
view.addEventListener('click', onClick);
bar.addEventListener('click', onClick);
view.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'f-newmat'){ ev.preventDefault(); addMat(ev.target.value, true); } });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  if (t.dataset.tab === 'new' && !draft) draft = blankDraft();
  show(t.dataset.tab);
}));

function show(which){
  tab = which;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === which));
  if (which === 'new'){ if (!draft) draft = blankDraft(); renderForm(); if (draft.picking) loadStatus(); } else renderList();
  window.scrollTo({top:0});
}

/* ---------- page des QR codes ---------- */
function renderQR(){
  document.title = 'Espace gestionnaire'; $('#hdr').hidden = true; bar.hidden = true; $('#foot').hidden = true;
  view.innerHTML = '<div class="card"><h2>Espace gestionnaire</h2><form id="adm"><label for="g">Code gestionnaire</label>' +
    '<input id="g" type="password" autocomplete="off" required><div id="gerr" class="errors" hidden></div>' +
    '<button class="btn primary" style="margin-top:14px;width:100%">Afficher les QR codes</button></form></div>';
  $('#adm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const err = $('#gerr'); err.hidden = true;
    try{
      if (!CFG.scriptUrl) throw new Error('scriptUrl vide');
      const r = await fetch(CFG.scriptUrl + '?action=admin&g=' + encodeURIComponent($('#g').value), {cache:'no-store'});
      const j = await r.json();
      if (j.ok) return showQR();
      err.textContent = j.error === 'non-configure' ? 'Aucun CODE_GESTIONNAIRE n\u2019est défini dans le script Google.' : 'Code incorrect.';
    }catch(e){ err.textContent = 'Vérification impossible (pas de connexion ?).'; }
    err.hidden = false;
  });
}
function showQR(){
  document.title = 'QR codes – ' + (CFG.titre || 'FabLab');
  $('#hdr').hidden = true; bar.hidden = true;
  const base = location.origin + location.pathname.replace(/index\.html$/, ''), key = getKey();
  const url = m => base + '?' + (key ? 'k=' + encodeURIComponent(key) : '') + (m ? (key ? '&' : '') + 'm=' + encodeURIComponent(m) : '');
  const card = (title, sub, link) => '<div class="qrcard">' + QR.svg(link) + '<b>' + esc(title) + '</b><small>' + esc(sub) + '</small></div>';
  let h = '<div class="noprint" style="margin:6px 0 14px"><a href="' + esc(base) + '">← Retour à l’appli</a> ' +
    '<button class="btn small primary" style="float:right" onclick="print()">Imprimer</button></div>' +
    '<p class="noprint">Un QR code général, puis un par machine (il ouvre l’appli avec la machine déjà choisie). ' +
    (key ? 'Ils contiennent le code d’accès : ne les affiche qu’au FabLab.' : 'Aucun code d’accès n’est enregistré sur cet appareil : ces QR codes ne le contiennent donc pas. Ouvre d’abord l’appli avec <code>?k=TON_CODE</code> si ton script est protégé.') + '</p>' +
    '<div class="qrgrid">' + card(CFG.titre || 'FabLab', 'Utilisation des machines', url(''));
  (CFG.machines||[]).forEach(m => { h += card(m.name, TYPES[m.type] ? TYPES[m.type].label : '', url(m.id)); });
  h += '</div>';
  view.innerHTML = h;
}

/* ---------- démarrage ---------- */
$('#ttl').innerHTML = esc(CFG.titre || 'FabLab') + '<small>Utilisation des machines</small>';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (qrMode){ renderQR(); }
else{
  if (preMachine && machineById(preMachine)) draft = blankDraft(preMachine);
  show('new'); setBadge(); loadStockMaterials(); sync(); loadStatus();
}
})();
</script>
</body>
</html>
